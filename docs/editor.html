<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身国 · 页面编辑神器</title>
    
    <!-- GrapesJS -->
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs"></script>
    
    <!-- GrapesJS 预设网页组件 -->
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background: #0a0a0a;
        }
        
        /* 自定义编辑器样式 */
        .gjs-editor {
            background: #0a0a0a;
        }
        
        /* 顶部面板 */
        .gjs-pn-panels {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(0, 0, 0, 0.9)) !important;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3) !important;
        }
        
        .gjs-pn-btn {
            color: #ffd700 !important;
        }
        
        .gjs-pn-btn:hover {
            background: rgba(255, 215, 0, 0.2) !important;
        }
        
        /* 左侧组件面板 */
        .gjs-blocks-c {
            background: rgba(15, 15, 25, 0.95) !important;
            border-right: 1px solid rgba(255, 215, 0, 0.2) !important;
        }
        
        .gjs-block {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 215, 0, 0.2) !important;
            color: #e0e0e0 !important;
            border-radius: 8px !important;
            margin: 5px !important;
            padding: 15px 10px !important;
        }
        
        .gjs-block:hover {
            background: rgba(255, 215, 0, 0.1) !important;
            border-color: #ffd700 !important;
        }
        
        .gjs-block svg {
            fill: #ffd700 !important;
        }
        
        /* 右侧属性面板 */
        .gjs-trt-traits {
            background: rgba(15, 15, 25, 0.95) !important;
            border-left: 1px solid rgba(255, 215, 0, 0.2) !important;
        }
        
        .gjs-trt-trait {
            color: #e0e0e0 !important;
        }
        
        .gjs-trt-trait--label {
            color: #ffd700 !important;
        }
        
        .gjs-field {
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 215, 0, 0.2) !important;
            color: #e0e0e0 !important;
            border-radius: 6px !important;
        }
        
        .gjs-field:focus {
            border-color: #ffd700 !important;
        }
        
        /* 中间画布 */
        .gjs-cv-canvas {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%) !important;
        }
        
        /* 选中的组件 */
        .gjs-selected {
            outline: 2px solid #ffd700 !important;
        }
        
        /* 图层面板 */
        .gjs-layer {
            background: rgba(15, 15, 25, 0.95) !important;
            color: #e0e0e0 !important;
        }
        
        .gjs-layer-title {
            color: #ffd700 !important;
        }
        
        /* 设备切换按钮 */
        .gjs-devices-c {
            background: rgba(0, 0, 0, 0.5) !important;
        }
        
        /* 类名输入框 */
        .gjs-clm-tags {
            background: rgba(0, 0, 0, 0.3) !important;
        }
        
        /* 样式面板 */
        .gjs-sm-sector-title {
            background: rgba(255, 215, 0, 0.1) !important;
            color: #ffd700 !important;
        }
        
        .gjs-sm-property {
            color: #e0e0e0 !important;
        }
        
        .gjs-sm-label {
            color: #888 !important;
        }
        
        /* 自定义顶部标题栏 */
        #custom-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(0, 0, 0, 0.95));
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10000;
        }
        
        #custom-header .logo {
            font-size: 18px;
            color: #ffd700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #custom-header .actions {
            display: flex;
            gap: 10px;
        }
        
        #custom-header .btn {
            padding: 6px 16px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            color: #ffd700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #custom-header .btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }
        
        #custom-header .btn.primary {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: #0a0a0a;
            border: none;
        }
        
        /* 编辑器容器 */
        #gjs {
            height: calc(100vh - 50px);
            margin-top: 50px;
        }
        
        /* 五神君组件样式 */
        .god-card {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
        }
        
        .god-card .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .god-card .name {
            font-size: 16px;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .god-card .title {
            font-size: 12px;
            color: #888;
        }
        
        .god-fire { background: linear-gradient(135deg, rgba(220, 38, 38, 0.3), transparent); }
        .god-wood { background: linear-gradient(135deg, rgba(22, 163, 74, 0.3), transparent); }
        .god-earth { background: linear-gradient(135deg, rgba(202, 138, 4, 0.3), transparent); }
        .god-metal { background: linear-gradient(135deg, rgba(217, 119, 6, 0.3), transparent); }
        .god-water { background: linear-gradient(135deg, rgba(37, 99, 235, 0.3), transparent); }
    </style>
</head>
<body>
    <!-- 自定义顶部 -->
    <div id="custom-header">
        <div class="logo">
            <span style="font-size: 22px;">🏛️</span>
            <span>身国 · 页面编辑神器</span>
        </div>
        <div class="actions">
            <button class="btn" onclick="loadTemplate()">📂 加载模板</button>
            <button class="btn" onclick="preview()">👁️ 预览</button>
            <button class="btn" onclick="exportHTML()">📤 导出HTML</button>
            <button class="btn primary" onclick="saveProject()">💾 保存项目</button>
        </div>
    </div>
    
    <!-- GrapesJS 编辑器 -->
    <div id="gjs"></div>
    
    <script>
        // 初始化编辑器
        const editor = grapesjs.init({
            container: '#gjs',
            height: '100%',
            fromElement: false,
            
            // 存储管理
            storageManager: {
                type: 'local',
                autosave: true,
                autoload: true,
                id: 'shenguo-editor'
            },
            
            // 设备管理
            deviceManager: {
                devices: [
                    { id: 'desktop', name: '桌面', width: '' },
                    { id: 'tablet', name: '平板', width: '768px' },
                    { id: 'mobile', name: '手机', width: '375px' }
                ]
            },
            
            // 插件
            plugins: ['gjs-preset-webpage'],
            pluginsOpts: {
                'gjs-preset-webpage': {
                    blocksBasicOpts: {
                        flexGrid: true
                    },
                    navbarOpts: false,
                    countdownOpts: false,
                    formsOpts: false
                }
            },
            
            // 画布样式
            canvas: {
                styles: [
                    'https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap'
                ]
            }
        });
        
        // 添加自定义组件
        editor.BlockManager.add('god-fire', {
            label: '❤️‍🔥 丹元神君',
            category: '五神君',
            content: `
                <div class="god-card god-fire">
                    <div class="icon">❤️‍🔥</div>
                    <div class="name">丹元神君</div>
                    <div class="title">心 · 灵明之主</div>
                </div>
            `
        });
        
        editor.BlockManager.add('god-wood', {
            label: '🐉 龙烟神君',
            category: '五神君',
            content: `
                <div class="god-card god-wood">
                    <div class="icon">🐉</div>
                    <div class="name">龙烟神君</div>
                    <div class="title">肝 · 谋略之主</div>
                </div>
            `
        });
        
        editor.BlockManager.add('god-earth', {
            label: '🏛️ 常在神君',
            category: '五神君',
            content: `
                <div class="god-card god-earth">
                    <div class="icon">🏛️</div>
                    <div class="name">常在神君</div>
                    <div class="title">脾 · 运化之主</div>
                </div>
            `
        });
        
        editor.BlockManager.add('god-metal', {
            label: '🦅 皓华神君',
            category: '五神君',
            content: `
                <div class="god-card god-metal">
                    <div class="icon">🦅</div>
                    <div class="name">皓华神君</div>
                    <div class="title">肺 · 治节之主</div>
                </div>
            `
        });
        
        editor.BlockManager.add('god-water', {
            label: '🐢 玄冥神君',
            category: '五神君',
            content: `
                <div class="god-card god-water">
                    <div class="icon">🐢</div>
                    <div class="name">玄冥神君</div>
                    <div class="title">肾 · 作强之主</div>
                </div>
            `
        });
        
        editor.BlockManager.add('gods-grid', {
            label: '⭐ 九宫图',
            category: '五神君',
            content: `
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px;">
                    <div style="text-align: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">🌬️<br><small>巽宫</small></div>
                    <div style="text-align: center; padding: 15px; background: rgba(220,38,38,0.2); border-radius: 8px;">❤️‍🔥<br><small>丹元</small></div>
                    <div style="text-align: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">🏔️<br><small>坤宫</small></div>
                    <div style="text-align: center; padding: 15px; background: rgba(22,163,74,0.2); border-radius: 8px;">🐉<br><small>龙烟</small></div>
                    <div style="text-align: center; padding: 15px; background: rgba(202,138,4,0.2); border-radius: 8px;">🏛️<br><small>常在</small></div>
                    <div style="text-align: center; padding: 15px; background: rgba(217,119,6,0.2); border-radius: 8px;">🦅<br><small>皓华</small></div>
                    <div style="text-align: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">🏔️<br><small>艮宫</small></div>
                    <div style="text-align: center; padding: 15px; background: rgba(37,99,235,0.2); border-radius: 8px;">🐢<br><small>玄冥</small></div>
                    <div style="text-align: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">☰<br><small>乾宫</small></div>
                </div>
            `
        });
        
        editor.BlockManager.add('treasure', {
            label: '💎 身国三宝',
            category: '身国系统',
            content: `
                <div style="padding: 20px;">
                    <div style="text-align: center; margin-bottom: 15px;">
                        <div style="font-size: 12px; color: #888;">精 · 归藏</div>
                        <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 8px 0;">
                            <div style="width: 75%; height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 3px;"></div>
                        </div>
                        <div style="font-size: 11px; color: #ffd700;">75/100</div>
                    </div>
                    <div style="text-align: center; margin-bottom: 15px;">
                        <div style="font-size: 12px; color: #888;">气 · 运化</div>
                        <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 8px 0;">
                            <div style="width: 60%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); border-radius: 3px;"></div>
                        </div>
                        <div style="font-size: 11px; color: #ffd700;">60/100</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 12px; color: #888;">神 · 灵明</div>
                        <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 8px 0;">
                            <div style="width: 85%; height: 100%; background: linear-gradient(90deg, #f59e0b, #fbbf24); border-radius: 3px;"></div>
                        </div>
                        <div style="font-size: 11px; color: #ffd700;">85/100</div>
                    </div>
                </div>
            `
        });
        
        editor.BlockManager.add('stat-card', {
            label: '📊 数据卡片',
            category: '身国系统',
            content: `
                <div style="text-align: center; padding: 30px 20px; background: rgba(255,215,0,0.05); border-radius: 12px; border: 1px solid rgba(255,215,0,0.2);">
                    <div style="font-size: 48px; color: #ffd700; font-weight: bold;">88</div>
                    <div style="font-size: 14px; color: #888; margin-top: 10px;">精气神指数</div>
                </div>
            `
        });
        
        editor.BlockManager.add('timeline', {
            label: '⏰ 时间线',
            category: '身国系统',
            content: `
                <div style="padding: 20px; position: relative;">
                    <div style="position: absolute; left: 30px; top: 0; bottom: 0; width: 2px; background: rgba(255,215,0,0.3);"></div>
                    <div style="margin-bottom: 20px; position: relative; padding-left: 30px;">
                        <div style="position: absolute; left: 21px; width: 16px; height: 16px; background: #ffd700; border-radius: 50%;"></div>
                        <div style="font-size: 14px; color: #ffd700;">辰时</div>
                        <div style="font-size: 12px; color: #888;">静坐修炼</div>
                    </div>
                    <div style="margin-bottom: 20px; position: relative; padding-left: 30px;">
                        <div style="position: absolute; left: 21px; width: 16px; height: 16px; background: #ffd700; border-radius: 50%;"></div>
                        <div style="font-size: 14px; color: #ffd700;">午时</div>
                        <div style="font-size: 12px; color: #888;">午休养神</div>
                    </div>
                    <div style="position: relative; padding-left: 30px;">
                        <div style="position: absolute; left: 21px; width: 16px; height: 16px; background: #ffd700; border-radius: 50%;"></div>
                        <div style="font-size: 14px; color: #ffd700;">酉时</div>
                        <div style="font-size: 12px; color: #888;">吐纳调息</div>
                    </div>
                </div>
            `
        });
        
        // 设置默认样式
        editor.setComponents(`
            <div style="padding: 40px; text-align: center;">
                <h1 style="color: #ffd700; font-size: 32px; margin-bottom: 20px;">身国 · 内景世界</h1>
                <p style="color: #888; font-size: 16px;">从左侧拖拽组件开始构建你的页面</p>
            </div>
        `);
        
        // 设置默认CSS
        editor.setStyle(`
            body {
                background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
                color: #e0e0e0;
                font-family: 'Microsoft YaHei', 'Noto Serif SC', serif;
            }
        `);
        
        // 功能函数
        function loadTemplate() {
            const templates = {
                '身国首页': `
                    <div style="padding: 20px;">
                        <h1 style="color: #ffd700; text-align: center; margin-bottom: 30px;">身国 · 内景世界</h1>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                            <div style="text-align: center; padding: 15px; background: rgba(220,38,38,0.2); border-radius: 8px;">❤️‍🔥<br><small>丹元</small></div>
                            <div style="text-align: center; padding: 15px; background: rgba(22,163,74,0.2); border-radius: 8px;">🐉<br><small>龙烟</small></div>
                            <div style="text-align: center; padding: 15px; background: rgba(202,138,4,0.2); border-radius: 8px;">🏛️<br><small>常在</small></div>
                            <div style="text-align: center; padding: 15px; background: rgba(217,119,6,0.2); border-radius: 8px;">🦅<br><small>皓华</small></div>
                            <div style="text-align: center; padding: 15px; background: rgba(37,99,235,0.2); border-radius: 8px;">🐢<br><small>玄冥</small></div>
                        </div>
                    </div>
                `
            };
            
            const choice = prompt('选择模板:\n1. 身国首页');
            if (choice === '1') {
                editor.setComponents(templates['身国首页']);
            }
        }
        
        function preview() {
            const html = editor.getHtml();
            const css = editor.getCss();
            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>预览</title>
                    <style>
                        body { background: #0a0a0a; color: #e0e0e0; font-family: 'Microsoft YaHei', serif; }
                        ${css}
                    </style>
                </head>
                <body>${html}</body>
                </html>
            `);
            win.document.close();
        }
        
        function exportHTML() {
            const html = editor.getHtml();
            const css = editor.getCss();
            
            const fullHTML = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身国 · 导出页面</title>
    <style>
        * { margin: 0; padding:0; box-sizing:border-box; }
        body { background: #0a0a0a; color: #e0e0e0; font-family: 'Microsoft YaHei', serif; }
        ${css}
    </style>
</head>
<body>
${html}
</body>
</html>`;
            
            // 复制到剪贴板
            navigator.clipboard.writeText(fullHTML).then(() => {
                alert('HTML代码已复制到剪贴板！');
            });
        }
        
        function saveProject() {
            editor.store();
            alert('项目已保存到浏览器！');
        }
        
        // 加载保存的项目
        editor.load();
    </script>
</body>
</html>
