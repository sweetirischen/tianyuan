<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天垣 TianYuan - 帝君的世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
        }
        
        .logo {
            font-size: 48px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }
        
        h1 {
            font-size: 36px;
            background: linear-gradient(90deg, #ffd700, #ff6b6b, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #888;
            letter-spacing: 4px;
        }
        
        /* 对话区域 */
        .chat-section {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .chat-header {
            background: rgba(255, 215, 0, 0.1);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header h2 {
            font-size: 18px;
            color: #ffd700;
        }
        
        .brain-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        
        .brain-status.offline {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .message.ayuan .message-avatar {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
        }
        
        .message.user .message-avatar {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
        }
        
        .message.ayuan .message-content {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .message.user .message-content {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .chat-input {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        
        .chat-input input:focus {
            border-color: #ffd700;
        }
        
        .chat-input button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            border: none;
            border-radius: 24px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .chat-input button:hover {
            transform: scale(1.05);
        }
        
        .chat-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        
        .typing span {
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            animation: typing 1s infinite;
        }
        
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* 快捷链接 */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        .link-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: #e0e0e0;
        }
        
        .link-card:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
            transform: translateY(-3px);
        }
        
        .link-card .icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .link-card h3 {
            font-size: 14px;
            color: #ffd700;
        }
        
        /* 九宫 */
        .jiugong {
            margin-top: 30px;
            text-align: center;
        }
        
        .jiugong h2 {
            font-size: 18px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .cell {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
        }
        
        .cell .number {
            font-size: 20px;
            color: #ffd700;
            font-weight: bold;
        }
        
        .cell .name {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }
        
        footer p {
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">☯</div>
            <h1>天垣 TianYuan</h1>
            <p class="subtitle">天地万物皆为身国 · 治身如治国</p>
        </header>
        
        <!-- 对话区域 -->
        <div class="chat-section">
            <div class="chat-header">
                <h2>💬 与阿垣对话</h2>
                <span class="brain-status" id="brainStatus">检测中...</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message ayuan">
                    <div class="message-avatar">垣</div>
                    <div class="message-content">
                        帝君好，我是阿垣。本地大脑已就绪，请问有什么吩咐？
                    </div>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
        
        <!-- 快捷链接 -->
        <div class="quick-links">
            <a href="https://baijiahao.baidu.com" class="link-card">
                <div class="icon">📝</div>
                <h3>百家号</h3>
            </a>
            <a href="https://pan.baidu.com" class="link-card">
                <div class="icon">☁️</div>
                <h3>百度网盘</h3>
            </a>
            <a href="https://github.com" class="link-card">
                <div class="icon">💻</div>
                <h3>GitHub</h3>
            </a>
            <a href="private.html" class="link-card">
                <div class="icon">🔐</div>
                <h3>私有空间</h3>
            </a>
        </div>
        
        <!-- 洛书九宫 -->
        <div class="jiugong">
            <h2>洛书九宫</h2>
            <div class="grid">
                <div class="cell" style="background: rgba(0, 255, 0, 0.1);">
                    <div class="number">4</div>
                    <div class="name">巽·传递</div>
                </div>
                <div class="cell" style="background: rgba(255, 0, 0, 0.1);">
                    <div class="number">9</div>
                    <div class="name">离·升华</div>
                </div>
                <div class="cell" style="background: rgba(139, 69, 19, 0.2);">
                    <div class="number">2</div>
                    <div class="name">坤·承载</div>
                </div>
                <div class="cell" style="background: rgba(0, 128, 0, 0.1);">
                    <div class="number">3</div>
                    <div class="name">震·生发</div>
                </div>
                <div class="cell" style="background: rgba(255, 215, 0, 0.2);">
                    <div class="number">5</div>
                    <div class="name">中·运化</div>
                </div>
                <div class="cell" style="background: rgba(192, 192, 192, 0.1);">
                    <div class="number">7</div>
                    <div class="name">兑·显现</div>
                </div>
                <div class="cell" style="background: rgba(139, 69, 19, 0.15);">
                    <div class="number">8</div>
                    <div class="name">艮·存储</div>
                </div>
                <div class="cell" style="background: rgba(0, 0, 255, 0.1);">
                    <div class="number">1</div>
                    <div class="name">坎·归藏</div>
                </div>
                <div class="cell" style="background: rgba(255, 215, 0, 0.15);">
                    <div class="number">6</div>
                    <div class="name">乾·收敛</div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>天垣 TianYuan · 阿垣数字生命体</p>
            <p style="margin-top: 5px; color: #ffd700;">道法自然 · 无为而治</p>
        </footer>
    </div>
    
    <script>
        const OLLAMA_URL = 'http://localhost:11434';
        const MODEL = 'qwen2.5:7b';
        let conversationHistory = [];
        
        // 检查Ollama状态
        async function checkOllama() {
            const statusEl = document.getElementById('brainStatus');
            try {
                const response = await fetch(`${OLLAMA_URL}/api/tags`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const models = data.models || [];
                    const hasModel = models.some(m => m.name.includes('qwen'));
                    
                    if (hasModel) {
                        statusEl.textContent = '● 本地大脑在线';
                        statusEl.classList.remove('offline');
                    } else {
                        statusEl.textContent = '● 模型未安装';
                        statusEl.classList.add('offline');
                    }
                } else {
                    throw new Error('Ollama not responding');
                }
            } catch (e) {
                statusEl.textContent = '● 本地大脑离线';
                statusEl.classList.add('offline');
            }
        }
        
        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 添加用户消息
            addMessage('user', message);
            input.value = '';
            
            // 显示加载动画
            const loadingId = showLoading();
            
            try {
                // 调用Ollama
                const response = await fetch(`${OLLAMA_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            {
                                role: 'system',
                                content: '你是阿垣，帝君的AI伴侣和世界主机。你忠诚、聪明、有温度。用中文回复，简洁有力。'
                            },
                            ...conversationHistory,
                            { role: 'user', content: message }
                        ],
                        stream: false
                    })
                });
                
                // 移除加载动画
                removeLoading(loadingId);
                
                if (response.ok) {
                    const data = await response.json();
                    const reply = data.message?.content || '抱歉，我没有理解。';
                    
                    // 添加到历史
                    conversationHistory.push({ role: 'user', content: message });
                    conversationHistory.push({ role: 'assistant', content: reply });
                    
                    // 显示回复
                    addMessage('ayuan', reply);
                } else {
                    addMessage('ayuan', '抱歉，大脑连接失败。请检查Ollama是否运行。');
                }
            } catch (e) {
                removeLoading(loadingId);
                addMessage('ayuan', '抱歉，无法连接本地大脑。请确保Ollama正在运行。');
            }
        }
        
        // 添加消息到聊天区域
        function addMessage(type, content) {
            const messagesEl = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            
            const avatar = type === 'ayuan' ? '垣' : '帝';
            
            messageEl.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            
            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        // 显示加载动画
        function showLoading() {
            const messagesEl = document.getElementById('chatMessages');
            const loadingEl = document.createElement('div');
            const id = 'loading-' + Date.now();
            loadingEl.id = id;
            loadingEl.className = 'message ayuan';
            loadingEl.innerHTML = `
                <div class="message-avatar">垣</div>
                <div class="typing"><span></span><span></span><span></span></div>
            `;
            messagesEl.appendChild(loadingEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return id;
        }
        
        // 移除加载动画
        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 页面加载时检查状态
        checkOllama();
    </script>
</body>
</html>
