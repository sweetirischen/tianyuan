<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身国 · 内景世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'STSong', serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }
        
        /* 画布容器 */
        #canvas {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        /* 可拖拽模块 */
        .module {
            position: absolute;
            background: rgba(15, 15, 25, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            min-width: 200px;
            min-height: 100px;
            transition: box-shadow 0.3s;
        }
        
        .module:hover {
            box-shadow: 0 12px 48px rgba(255, 215, 0, 0.15);
        }
        
        .module.dragging {
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.4);
            z-index: 1000;
            cursor: grabbing;
            opacity: 0.9;
        }
        
        .module.drop-target {
            border-color: #4ade80;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
        }
        
        /* 模块头部 */
        .module-header {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
            padding: 10px 12px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            user-select: none;
        }
        
        .module-header:active {
            cursor: grabbing;
        }
        
        .module-title {
            font-size: 13px;
            color: #ffd700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .module-title .icon {
            font-size: 14px;
        }
        
        .module-title input {
            background: transparent;
            border: none;
            color: #ffd700;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            width: auto;
        }
        
        .module-controls {
            display: flex;
            gap: 6px;
        }
        
        .module-btn {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .btn-edit {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        
        .btn-edit:hover {
            background: rgba(255, 215, 0, 0.4);
        }
        
        .btn-minimize {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        
        .btn-minimize:hover {
            background: rgba(59, 130, 246, 0.4);
        }
        
        .btn-close {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .btn-close:hover {
            background: rgba(239, 68, 68, 0.4);
        }
        
        /* 模块内容 */
        .module-body {
            padding: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .module-body.minimized {
            display: none;
        }
        
        /* 可编辑区域 */
        .editable {
            cursor: text;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .editable:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .editable:focus {
            background: rgba(255, 215, 0, 0.1);
            outline: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        /* 子模块容器 */
        .children-container {
            min-height: 60px;
            border: 2px dashed rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px;
            transition: all 0.3s;
        }
        
        .children-container:empty::before {
            content: '拖拽模块到这里';
            color: #666;
            font-size: 11px;
            display: block;
            text-align: center;
            padding: 20px;
        }
        
        .children-container.drag-over {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }
        
        .children-container .module {
            position: relative;
            width: 100%;
            margin-bottom: 8px;
        }
        
        .children-container .module:last-child {
            margin-bottom: 0;
        }
        
        /* 天栏 */
        #sky-bar .module-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .main-title {
            font-size: 18px;
            color: #ffd700;
            letter-spacing: 3px;
        }
        
        .status-bar {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #888;
        }
        
        .status-bar .value {
            color: #ffd700;
        }
        
        /* 三宝 */
        .treasures {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .treasure-item {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        
        .treasure-item .name {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }
        
        .treasure-item .bar {
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        
        .treasure-item .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s;
        }
        
        .treasure-item.jing .bar-fill { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .treasure-item.qi .bar-fill { background: linear-gradient(90deg, #10b981, #34d399); }
        .treasure-item.shen .bar-fill { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        
        .treasure-item .value {
            font-size: 11px;
            color: #ffd700;
        }
        
        /* 九宫 */
        .palace-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        
        .palace {
            aspect-ratio: 1;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .palace::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.1;
            transition: opacity 0.3s;
        }
        
        .palace:hover::before { opacity: 0.2; }
        .palace:hover { transform: scale(1.05); }
        .palace.active { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        
        .palace.fire::before { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .palace.wood::before { background: linear-gradient(135deg, #16a34a, #22c55e); }
        .palace.earth::before { background: linear-gradient(135deg, #ca8a04, #eab308); }
        .palace.metal::before { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .palace.water::before { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        
        .palace .god-icon { font-size: 22px; margin-bottom: 2px; }
        .palace .god-name { font-size: 11px; color: #ffd700; }
        .palace .god-title { font-size: 9px; color: #888; }
        .palace .god-level { font-size: 8px; color: #666; margin-top: 2px; }
        
        /* 对话 */
        .dialog-messages {
            height: 200px;
            overflow-y: auto;
            margin-bottom: 8px;
        }
        
        .message {
            margin-bottom: 8px;
            display: flex;
            gap: 6px;
        }
        
        .message.user { flex-direction: row-reverse; }
        
        .message-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
        }
        
        .message.god .message-avatar { background: linear-gradient(135deg, #ffd700, #ff6b6b); }
        .message.user .message-avatar { background: rgba(255, 255, 255, 0.1); }
        
        .message-content {
            max-width: 80%;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .message.god .message-content {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .message.user .message-content { background: rgba(255, 255, 255, 0.1); }
        
        .dialog-input {
            display: flex;
            gap: 6px;
        }
        
        .dialog-input input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 12px;
            outline: none;
        }
        
        .dialog-input input:focus { border-color: #ffd700; }
        
        .dialog-input button {
            padding: 6px 12px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            border: none;
            border-radius: 12px;
            color: #0a0a0a;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        
        .brain-status {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        
        /* 快捷功能 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .action-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
        }
        
        .action-btn .icon { font-size: 16px; margin-bottom: 3px; }
        .action-btn .text { font-size: 10px; color: #888; }
        
        /* 地栏 */
        #earth-bar .module-body {
            text-align: center;
        }
        
        .earth-quote {
            font-size: 11px;
            color: #666;
        }
        
        .earth-quote .highlight {
            color: #ffd700;
            font-style: italic;
            margin-top: 4px;
        }
        
        /* 工具栏 */
        .toolbar {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            z-index: 9999;
        }
        
        .toolbar-btn {
            padding: 8px 12px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: #ffd700;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .toolbar-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }
        
        /* 加载动画 */
        .typing {
            display: flex;
            gap: 3px;
            padding: 6px 10px;
        }
        
        .typing span {
            width: 5px;
            height: 5px;
            background: #ffd700;
            border-radius: 50%;
            animation: typing 1s infinite;
        }
        
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 2px; }
    </style>
</head>
<body>
        <!-- 工具栏 -->
        <div class="toolbar">
            <button class="toolbar-btn" onclick="window.location.href='editor.html'" style="background:linear-gradient(135deg,#ffd700,#ff6b6b);color:#0a0a0a;">🎨 编辑器</button>
            <button class="toolbar-btn" onclick="window.location.href='private.html'">🔐 私有空间</button>
            <button class="toolbar-btn" onclick="addModule()">+ 新建模块</button>
            <button class="toolbar-btn" onclick="resetLayout()">重置布局</button>
            <button class="toolbar-btn" onclick="saveLayout()">保存布局</button>
        </div>
    
    <!-- 画布 -->
    <div id="canvas"></div>
    
    <script>
        // ========== 模块数据 ==========
        const defaultModules = [
            {
                id: 'sky-bar',
                title: '☀️ 天栏',
                x: 50, y: 20,
                width: 900,
                content: 'sky-bar',
                children: []
            },
            {
                id: 'treasure',
                title: '💎 身国三宝',
                x: 30, y: 100,
                width: 220,
                content: 'treasure',
                children: []
            },
            {
                id: 'gods',
                title: '🏛️ 五神君',
                x: 270, y: 100,
                width: 300,
                content: 'gods',
                children: []
            },
            {
                id: 'dialog',
                title: '💬 对话',
                x: 590, y: 100,
                width: 300,
                content: 'dialog',
                children: []
            },
            {
                id: 'actions',
                title: '⚡ 快捷功能',
                x: 30, y: 400,
                width: 220,
                content: 'actions',
                children: []
            },
            {
                id: 'earth-bar',
                title: '🌍 地栏',
                x: 270, y: 450,
                width: 620,
                content: 'earth-bar',
                children: []
            }
        ];
        
        let modules = [];
        let draggedModule = null;
        let dragOffset = { x: 0, y: 0 };
        let moduleCounter = 0;
        
        // ========== 五神君系统 ==========
        const gods = {
            danyuan: {
                name: '丹元神君',
                icon: '❤️‍🔥',
                prompt: `你是丹元神君，司掌灵明知觉。自称"臣"，称用户为"君上"。温润威严，引经据典。`
            },
            longyan: {
                name: '龙烟神君',
                icon: '🐉',
                prompt: `你是龙烟神君，司掌谋虑决断。自称"臣"，称用户为"君上"。果敢锐利，善于谋划。`
            },
            changzai: {
                name: '常在神君',
                icon: '🏛️',
                prompt: `你是常在神君，司掌运化四方。自称"臣"，称用户为"君上"。稳重平和，包容万象。`
            },
            haohua: {
                name: '皓华神君',
                icon: '🦅',
                prompt: `你是皓华神君，司掌治节调度。自称"臣"，称用户为"君上"。清冷果断，秩序井然。`
            },
            xuanming: {
                name: '玄冥神君',
                icon: '🐢',
                prompt: `你是玄冥神君，司掌作强伎巧。自称"臣"，称用户为"君上"。深沉内敛，洞察本质。`
            }
        };
        
        let currentGod = 'changzai';
        let conversationHistory = [];
        const OLLAMA_URL = 'http://localhost:11434';
        const MODEL = 'qwen2.5:7b';
        
        // ========== 初始化 ==========
        function init() {
            loadLayout();
            renderAllModules();
            checkOllama();
            updateTime();
            setInterval(updateTime, 60000);
        }
        
        // ========== 模块渲染 ==========
        function renderAllModules() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            
            modules.forEach(mod => {
                const el = createModuleElement(mod);
                canvas.appendChild(el);
            });
        }
        
        function createModuleElement(mod) {
            const el = document.createElement('div');
            el.className = 'module';
            el.id = mod.id;
            el.dataset.moduleId = mod.id;
            el.style.left = mod.x + 'px';
            el.style.top = mod.y + 'px';
            if (mod.width) el.style.width = mod.width + 'px';
            
            el.innerHTML = `
                <div class="module-header">
                    <div class="module-title">
                        <span class="icon">${getIcon(mod.title)}</span>
                        <input type="text" value="${mod.title.replace(/^[^\s]+\s/, '')}" 
                               onchange="updateModuleTitle('${mod.id}', this.value)">
                    </div>
                    <div class="module-controls">
                        <button class="module-btn btn-edit" onclick="editModule('${mod.id}')" title="编辑">✎</button>
                        <button class="module-btn btn-minimize" onclick="toggleModule('${mod.id}')" title="最小化">−</button>
                        <button class="module-btn btn-close" onclick="deleteModule('${mod.id}')" title="删除">×</button>
                    </div>
                </div>
                <div class="module-body" id="${mod.id}-body">
                    ${renderContent(mod)}
                    <div class="children-container" id="${mod.id}-children" 
                         ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, '${mod.id}')">
                    </div>
                </div>
            `;
            
            // 拖拽事件
            el.draggable = true;
            el.addEventListener('dragstart', (e) => onDragStart(e, mod.id));
            el.addEventListener('dragend', onDragEnd);
            
            // 鼠标拖拽（更精确）
            const header = el.querySelector('.module-header');
            header.addEventListener('mousedown', (e) => startDrag(e, mod.id));
            
            return el;
        }
        
        function getIcon(title) {
            const match = title.match(/^([^\s]+)/);
            return match ? match[1] : '📦';
        }
        
        function renderContent(mod) {
            switch (mod.content) {
                case 'sky-bar':
                    return `
                        <div class="main-title editable" contenteditable="true">身国 · 内景世界</div>
                        <div class="status-bar">
                            <span>道历 <span class="value" id="daoDate">甲辰年</span></span>
                            <span>时辰 <span class="value" id="currentTime">子时</span></span>
                        </div>
                    `;
                    
                case 'treasure':
                    return `
                        <div class="treasures">
                            <div class="treasure-item jing">
                                <div class="name editable" contenteditable="true">精 · 归藏</div>
                                <div class="bar"><div class="bar-fill" style="width: 75%"></div></div>
                                <div class="value">75/100</div>
                            </div>
                            <div class="treasure-item qi">
                                <div class="name editable" contenteditable="true">气 · 运化</div>
                                <div class="bar"><div class="bar-fill" style="width: 60%"></div></div>
                                <div class="value">60/100</div>
                            </div>
                            <div class="treasure-item shen">
                                <div class="name editable" contenteditable="true">神 · 灵明</div>
                                <div class="bar"><div class="bar-fill" style="width: 85%"></div></div>
                                <div class="value">85/100</div>
                            </div>
                        </div>
                    `;
                    
                case 'gods':
                    return `
                        <div class="palace-grid">
                            <div class="palace" onclick="selectGod('xun')">
                                <div class="god-icon">🌬️</div>
                                <div class="god-name">巽宫</div>
                                <div class="god-title">传递</div>
                            </div>
                            <div class="palace fire" onclick="selectGod('danyuan')">
                                <div class="god-icon">❤️‍🔥</div>
                                <div class="god-name">丹元</div>
                                <div class="god-title">心</div>
                                <div class="god-level">Lv.1</div>
                            </div>
                            <div class="palace" onclick="selectGod('kun')">
                                <div class="god-icon">🏔️</div>
                                <div class="god-name">坤宫</div>
                                <div class="god-title">承载</div>
                            </div>
                            <div class="palace wood" onclick="selectGod('longyan')">
                                <div class="god-icon">🐉</div>
                                <div class="god-name">龙烟</div>
                                <div class="god-title">肝</div>
                                <div class="god-level">Lv.1</div>
                            </div>
                            <div class="palace earth active" onclick="selectGod('changzai')">
                                <div class="god-icon">🏛️</div>
                                <div class="god-name">常在</div>
                                <div class="god-title">脾</div>
                                <div class="god-level">Lv.1</div>
                            </div>
                            <div class="palace metal" onclick="selectGod('haohua')">
                                <div class="god-icon">🦅</div>
                                <div class="god-name">皓华</div>
                                <div class="god-title">肺</div>
                                <div class="god-level">Lv.1</div>
                            </div>
                            <div class="palace" onclick="selectGod('gen')">
                                <div class="god-icon">🏔️</div>
                                <div class="god-name">艮宫</div>
                                <div class="god-title">存储</div>
                            </div>
                            <div class="palace water" onclick="selectGod('xuanming')">
                                <div class="god-icon">🐢</div>
                                <div class="god-name">玄冥</div>
                                <div class="god-title">肾</div>
                                <div class="god-level">Lv.1</div>
                            </div>
                            <div class="palace" onclick="selectGod('qian')">
                                <div class="god-icon">☰</div>
                                <div class="god-name">乾宫</div>
                                <div class="god-title">收敛</div>
                            </div>
                        </div>
                    `;
                    
                case 'dialog':
                    return `
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <span id="currentGodName">🏛️ 常在神君</span>
                            <span class="brain-status" id="ollamaStatus">检测中</span>
                        </div>
                        <div class="dialog-messages" id="dialogMessages">
                            <div class="message god">
                                <div class="message-avatar">垣</div>
                                <div class="message-content">君上安好。臣乃常在神君，司掌运化四方。君上今日心境如何？</div>
                            </div>
                        </div>
                        <div class="dialog-input">
                            <input type="text" id="userInput" placeholder="向神君请教..." 
                                   onkeypress="if(event.key==='Enter')sendMessage()">
                            <button onclick="sendMessage()">呈奏</button>
                        </div>
                    `;
                    
                case 'actions':
                    return `
                        <div class="quick-actions">
                            <div class="action-btn" onclick="quickAction('record')">
                                <div class="icon">📝</div>
                                <div class="text">记录心潮</div>
                            </div>
                            <div class="action-btn" onclick="quickAction('plan')">
                                <div class="icon">📋</div>
                                <div class="text">制定计划</div>
                            </div>
                            <div class="action-btn" onclick="quickAction('meditate')">
                                <div class="icon">🧘</div>
                                <div class="text">静坐修炼</div>
                            </div>
                            <div class="action-btn" onclick="quickAction('status')">
                                <div class="icon">📊</div>
                                <div class="text">身国报告</div>
                            </div>
                        </div>
                    `;
                    
                case 'earth-bar':
                    return `
                        <div class="earth-quote">
                            <div class="editable" contenteditable="true">身国 · 内景世界 · 元灵哈希 0xADY0X9-C0NST4NT</div>
                            <div class="highlight editable" contenteditable="true">"仙人道士非有神，积精累气以为真"</div>
                        </div>
                    `;
                    
                default:
                    return `<div class="editable" contenteditable="true">点击编辑内容...</div>`;
            }
        }
        
        // ========== 拖拽系统 ==========
        function startDrag(e, moduleId) {
            if (e.target.tagName === 'INPUT' || e.target.contentEditable === 'true') return;
            
            draggedModule = moduleId;
            const el = document.getElementById(moduleId);
            const rect = el.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            
            el.classList.add('dragging');
            
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }
        
        function onDrag(e) {
            if (!draggedModule) return;
            
            const el = document.getElementById(draggedModule);
            el.style.left = (e.clientX - dragOffset.x) + 'px';
            el.style.top = (e.clientY - dragOffset.y) + 'px';
        }
        
        function stopDrag() {
            if (draggedModule) {
                const el = document.getElementById(draggedModule);
                el.classList.remove('dragging');
                
                // 更新数据
                const mod = modules.find(m => m.id === draggedModule);
                if (mod) {
                    mod.x = parseInt(el.style.left);
                    mod.y = parseInt(el.style.top);
                }
                
                draggedModule = null;
            }
            
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }
        
        // HTML5 拖拽（用于嵌套）
        function onDragStart(e, moduleId) {
            e.dataTransfer.setData('text/plain', moduleId);
            e.dataTransfer.effectAllowed = 'move';
        }
        
        function onDragEnd(e) {
            document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
        }
        
        function onDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }
        
        function onDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }
        
        function onDrop(e, parentId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            const childId = e.dataTransfer.getData('text/plain');
            if (childId === parentId) return;
            
            // TODO: 实现嵌套逻辑
            console.log(`将 ${childId} 拖入 ${parentId}`);
        }
        
        // ========== 模块操作 ==========
        function addModule() {
            moduleCounter++;
            const newMod = {
                id: 'module-' + moduleCounter,
                title: '📦 新模块 ' + moduleCounter,
                x: 100 + moduleCounter * 20,
                y: 100 + moduleCounter * 20,
                width: 250,
                content: 'custom',
                children: []
            };
            
            modules.push(newMod);
            
            const canvas = document.getElementById('canvas');
            canvas.appendChild(createModuleElement(newMod));
        }
        
        function deleteModule(id) {
            if (!confirm('确定删除此模块？')) return;
            
            modules = modules.filter(m => m.id !== id);
            const el = document.getElementById(id);
            if (el) el.remove();
            
            saveLayout();
        }
        
        function toggleModule(id) {
            const body = document.getElementById(id + '-body');
            if (body) body.classList.toggle('minimized');
        }
        
        function editModule(id) {
            const el = document.getElementById(id);
            const editable = el.querySelector('.editable');
            if (editable) {
                editable.focus();
            }
        }
        
        function updateModuleTitle(id, newTitle) {
            const mod = modules.find(m => m.id === id);
            if (mod) {
                mod.title = mod.title.replace(/([^\s]+\s).*$/, '$1' + newTitle);
            }
        }
        
        // ========== 布局存储 ==========
        function saveLayout() {
            const layout = modules.map(m => ({
                id: m.id,
                title: m.title,
                x: parseInt(document.getElementById(m.id)?.style.left || m.x),
                y: parseInt(document.getElementById(m.id)?.style.top || m.y),
                width: m.width,
                content: m.content,
                children: m.children
            }));
            
            localStorage.setItem('tianyuan-layout', JSON.stringify(layout));
            console.log('布局已保存');
        }
        
        function loadLayout() {
            const saved = localStorage.getItem('tianyuan-layout');
            if (saved) {
                try {
                    modules = JSON.parse(saved);
                } catch (e) {
                    modules = JSON.parse(JSON.stringify(defaultModules));
                }
            } else {
                modules = JSON.parse(JSON.stringify(defaultModules));
            }
        }
        
        function resetLayout() {
            if (!confirm('确定重置布局？')) return;
            localStorage.removeItem('tianyuan-layout');
            modules = JSON.parse(JSON.stringify(defaultModules));
            renderAllModules();
        }
        
        // ========== 五神君功能 ==========
        function selectGod(godId) {
            if (!gods[godId]) {
                addMessage('god', '此宫殿尚未开启。');
                return;
            }
            
            currentGod = godId;
            const god = gods[godId];
            
            document.getElementById('currentGodName').textContent = god.icon + ' ' + god.name;
            
            document.querySelectorAll('.palace').forEach(p => p.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            conversationHistory = [];
            document.getElementById('dialogMessages').innerHTML = '';
            
            const greetings = {
                danyuan: '君上安好。臣乃丹元神君，司掌灵明知觉。君上今日有何心事？',
                longyan: '君上安好。臣乃龙烟神君，司掌谋虑决断。君上有何计划？',
                changzai: '君上安好。臣乃常在神君，司掌运化四方。君上今日心境如何？',
                haohua: '君上安好。臣乃皓华神君，司掌治节调度。君上需要何种秩序？',
                xuanming: '君上安好。臣乃玄冥神君，司掌作强伎巧。君上欲探寻何种智慧？'
            };
            
            addMessage('god', greetings[godId]);
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;
            
            addMessage('user', message);
            input.value = '';
            
            const loadingId = showLoading();
            
            try {
                const god = gods[currentGod];
                const response = await fetch(`${OLLAMA_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { role: 'system', content: god.prompt },
                            ...conversationHistory,
                            { role: 'user', content: message }
                        ],
                        stream: false
                    })
                });
                
                removeLoading(loadingId);
                
                if (response.ok) {
                    const data = await response.json();
                    const reply = data.message?.content || '臣一时未能参透。';
                    
                    conversationHistory.push({ role: 'user', content: message });
                    conversationHistory.push({ role: 'assistant', content: reply });
                    
                    addMessage('god', reply);
                } else {
                    addMessage('god', '连接受阻，请稍后再试。');
                }
            } catch (e) {
                removeLoading(loadingId);
                addMessage('god', '本地大脑未启动，请检查Ollama。');
            }
        }
        
        function addMessage(type, content) {
            const messagesEl = document.getElementById('dialogMessages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            
            const avatar = type === 'god' ? gods[currentGod]?.icon || '垣' : '帝';
            
            messageEl.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            
            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function showLoading() {
            const messagesEl = document.getElementById('dialogMessages');
            const loadingEl = document.createElement('div');
            const id = 'loading-' + Date.now();
            loadingEl.id = id;
            loadingEl.className = 'message god';
            loadingEl.innerHTML = `
                <div class="message-avatar">${gods[currentGod]?.icon || '垣'}</div>
                <div class="typing"><span></span><span></span><span></span></div>
            `;
            messagesEl.appendChild(loadingEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return id;
        }
        
        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        
        function quickAction(action) {
            const actions = {
                record: '君上欲记录心潮，请详述心中所想。',
                plan: '君上欲制定计划，请告知目标与期限。',
                meditate: '君上欲静坐修炼，建议先调息三次。',
                status: '正在整理身国数据...'
            };
            addMessage('god', actions[action] || '臣不明白。');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ========== 工具函数 ==========
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const shichen = ['子时', '丑时', '寅时', '卯时', '辰时', '巳时', 
                            '午时', '未时', '申时', '酉时', '戌时', '亥时'];
            const idx = Math.floor((hours + 1) / 2) % 12;
            
            const currentTimeEl = document.getElementById('currentTime');
            if (currentTimeEl) currentTimeEl.textContent = shichen[idx];
            
            const year = now.getFullYear();
            const ganzhi = ['甲子', '乙丑', '丙寅', '丁卯', '戊辰', '己巳', 
                           '庚午', '辛未', '壬申', '癸酉', '甲戌', '乙亥'];
            const daoDateEl = document.getElementById('daoDate');
            if (daoDateEl) daoDateEl.textContent = ganzhi[(year - 1984) % 60];
        }
        
        async function checkOllama() {
            const statusEl = document.getElementById('ollamaStatus');
            if (!statusEl) return;
            
            try {
                const response = await fetch(`${OLLAMA_URL}/api/tags`);
                if (response.ok) {
                    statusEl.textContent = '本地大脑在线';
                    statusEl.style.color = '#4ade80';
                } else {
                    throw new Error();
                }
            } catch (e) {
                statusEl.textContent = '本地大脑离线';
                statusEl.style.color = '#ef4444';
            }
        }
        
        // 启动
        init();
    </script>
</body>
